<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reposteria Criko</title>

    <style>

        .titulo {
            font-size: 45px;
            margin-top: 50px;
            margin-bottom: 100px;
            color: rgb(83, 0, 99);
        }

        .eishin-contenedor {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 300px;
            height: 400px;
            z-index: 999;
            cursor: pointer;
        }

        .eishin {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 400px;

            transition:
                transform 0.3s ease,
                opacity 0.3s ease;
        }

        .imagen-hover {
            opacity: 0;
        }

        .eishin-contenedor:hover .imagen-normal {
            opacity: 0;
            transform: scale(1.15);
        }

        .eishin-contenedor:hover .imagen-hover {
            opacity: 1;
            transform: scale(1.15);
            width: 390px;
        }

        .receta {
            display: flex;
            justify-content: center;
            align-items: stretch;
            gap: 15px;

            width: 650px;
            margin: 0 auto 35px auto;

            transition: transform 0.4s ease;
        }

        .receta:hover {
            transform: scale(1.05);
        }

        .cuadro-texto {
            width: 300px;
            min-height: 250px;
            height: auto;

            padding: 20px;

            background-color: rgba(255, 255, 255, 0.85);

            border-radius: 20px;

            box-shadow:
                0 5px 15px rgba(0, 0, 0, 0.3);

            box-sizing: border-box;
        }

        .cuadro-texto h2 {
            color: rgb(83, 0, 99);
            margin-top: 0;
            font-size: 22px;
        }

        .cuadro-texto p {
            font-size: 16px;
            line-height: 1.3;
            margin: 8px 0;
        }

        .cuadro-imagen {
            width: 300px;
            height: auto;

            background-color: rgba(255, 255, 255, 0.85);

            border-radius: 20px;

            padding: 10px;

            box-sizing: border-box;

            box-shadow:
                0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .cuadro-imagen img {
            width: 100%;
            height: auto;

            object-fit: cover;

            border-radius: 15px;
        }

.video {
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100%;
}

.video iframe {
    width: 560px;
    height: 315px;
    border: none;
}

    </style>

</head>

    background-image: url('images (1).jpg');

</html>
