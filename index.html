<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reposteria Criko</title>

    <style>

        .titulo {
            font-size: 45px;
            margin-top: 50px;
            margin-bottom: 100px;
            color: rgb(83, 0, 99);
        }


        .eishin-contenedor {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 300px;
            height: 400px;
            z-index: 999;
            cursor: pointer;
        }


        .eishin {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 400px;

            transition:
                transform 0.3s ease,
                opacity 0.3s ease;
        }


        .imagen-hover {
            opacity: 0;
        }


        .eishin-contenedor:hover .imagen-normal {
            opacity: 0;
            transform: scale(1.15);
        }


        .eishin-contenedor:hover .imagen-hover {
            opacity: 1;
            transform: scale(1.15);
            width: 390px;
        }

        .receta {
            display: flex;
            justify-content: center;
            align-items: stretch;
            gap: 15px;

            width: 650px;
            margin: 0 auto 35px auto;

            transition: transform 0.4s ease;
        }


        .receta:hover {
            transform: scale(1.05);
        }


        .cuadro-texto {
            width: 300px;
            min-height: 250px;
            height: auto;

            padding: 20px;

            background-color: rgba(255, 205, 251, 0.85);

            border-radius: 20px;

            box-shadow:
                0 5px 15px rgba(0, 0, 0, 0.3);

            box-sizing: border-box;
        }


        .cuadro-texto h2 {
            color: rgb(83, 0, 99);
            margin-top: 0;
            font-size: 22px;
        }


        .cuadro-texto p {
            font-size: 16px;
            line-height: 1.3;
            margin: 8px 0;
        }


        .cuadro-imagen {
            width: 300px;
            height: auto;

            background-color: rgba(73, 33, 0, 0.596);

            border-radius: 20px;

            padding: 10px;

            box-sizing: border-box;

            box-shadow:
                0 5px 15px rgba(0, 0, 0, 0.3);
        }


        .cuadro-imagen img {
            width: 100%;
            height: auto;

            object-fit: cover;

            border-radius: 15px;
        }

    </style>

</head>


<body style="
    background-image: url('images (1).jpg');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    background-color: rgba(0, 0, 0, 0.292);
">


    <center>

        <strong>

            <h1 class="titulo">
                Libro de recetas San Valentín
            </h1>

        </strong>

    </center>

    <div class="receta">

        <div class="cuadro-texto">

            <h2>Brownies de chocolate</h2>

            <p>
                <strong>Ingredientes:</strong>
            </p>

            <p>
                Chocolate negro <br>
                Mantequilla <br>
                Huevos <br>
                Azúcar <br>
                Vainilla <br>
                Harina <br>
                Bicarbonato <br>
                Nueces <br>
                Pepitas de chocolate
            </p>

        </div>


        <div class="cuadro-imagen">

            <img
                src="Brownie.jpg"
                alt="Brownie"
            >

        </div>

    </div>




    <div class="receta">

        <div class="cuadro-texto">

            <h2>Chocolatinas</h2>

            <p>
                <strong>Ingredientes:</strong>
            </p>

            <p>
                Chocolate <br>
                Molde de silicona (corazón) <br>
                Espátula
            </p>

        </div>


        <div class="cuadro-imagen">

            <img
                src="cozaronrotado.avif"
                alt="Chocolatinas"
            >

        </div>

    </div>

    <a
        href="menu.html"
        class="eishin-contenedor"
    >

        <img
            src="amormio.png"
            alt="Eishin"
            class="eishin imagen-normal"
        >
        <img
            src="amorprecioso.png"
            alt="Eishin"
            class="eishin imagen-hover"
        >
    </a>

</body>

</html>
